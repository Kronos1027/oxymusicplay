name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/OxyMusic-${{ steps.version.outputs.version }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OxyMusic-${{ steps.version.outputs.version }}
          path: artifacts/*.apk
          retention-days: 90

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          name: OxyMusic ${{ steps.version.outputs.version }}
          body: |
            ## 🎵 OxyMusic ${{ steps.version.outputs.version }}

            ### 📥 Instalação
            1. Baixe o arquivo `OxyMusic-${{ steps.version.outputs.version }}.apk` abaixo
            2. Permita instalação de fontes desconhecidas
            3. Toque no APK para instalar

            ### ⚙️ Otimização HyperOS/MIUI
            - Configurações → Apps → OxyMusic → Bateria → "Sem restrições"
            - Segurança → Permissões → Auto-start → ative

            ### 📋 Changelog
            Veja [CHANGELOG.md](https://github.com/Kronos1027/oxymusicplay/blob/main/CHANGELOG.md)
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up old assets from release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Delete any APK assets that don't match the current version
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${{ steps.version.outputs.version }}"
          echo "Cleaning up old assets from release $TAG_NAME (keeping only $VERSION)"
          # Get release ID
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_NAME" | \
            python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
          if [ -z "$RELEASE_ID" ]; then
            echo "No release found for tag $TAG_NAME"
            exit 0
          fi
          # List assets and delete any that don't match current version
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | \
            python3 -c "
          import json, sys, subprocess
          assets = json.load(sys.stdin)
          for a in assets:
              name = a.get('name', '')
              aid = a.get('id', '')
              if '$VERSION' not in name:
                  print(f'Deleting old asset: {name} (id={aid})')
                  subprocess.run(['curl', '-s', '-X', 'DELETE', '-H', 'Authorization: token \${{ secrets.GITHUB_TOKEN }}',
                      f'https://api.github.com/repos/${{ github.repository }}/releases/assets/{aid}'],
                      capture_output=True)
              else:
                  print(f'Keeping: {name}')
          "

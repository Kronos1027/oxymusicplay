name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ------------------------------------------------------------------
      # Decode signing keystore from secrets (base64-encoded)
      # Required secrets (Settings → Secrets → Actions):
      #   OXY_KEYSTORE_BASE64   — base64 of the .jks file (run: base64 -w0 oxymusic-release.jks)
      #   OXY_KEYSTORE_PASSWORD — keystore password (e.g. "oxymusic")
      #   OXY_KEY_ALIAS         — key alias (e.g. "oxymusic")
      #   OXY_KEY_PASSWORD      — key password (e.g. "oxymusic")
      #
      # If secrets are missing, falls back to debug signing (only for non-tag builds).
      # ------------------------------------------------------------------
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p keystore
          echo "${{ secrets.OXY_KEYSTORE_BASE64 }}" | base64 -d > keystore/oxymusic-release.jks
          ls -la keystore/
        continue-on-error: false

      - name: Build debug APK (for branch pushes / PRs)
        if: startsWith(github.ref, 'refs/tags/v') == false
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Build release APK (for tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OXY_KEYSTORE_PASSWORD: ${{ secrets.OXY_KEYSTORE_PASSWORD }}
          OXY_KEY_ALIAS: ${{ secrets.OXY_KEY_ALIAS }}
          OXY_KEY_PASSWORD: ${{ secrets.OXY_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Rename APK
        run: |
          mkdir -p artifacts
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/OxyMusic-${{ steps.version.outputs.version }}.apk
            echo "Release APK copied"
          else
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/OxyMusic-${{ steps.version.outputs.version }}-debug.apk
            echo "Debug APK copied"
          fi
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OxyMusic-${{ steps.version.outputs.version }}
          path: artifacts/*.apk
          retention-days: 90

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          name: OxyMusic ${{ steps.version.outputs.version }}
          body: |
            ## 🎵 OxyMusic ${{ steps.version.outputs.version }}

            ### 🔥 Destaques desta versão

            **v2.0.0 — Reforma completa**
            - **Playback consertado**: NewPipeExtractor + poToken real via BotGuard WebView + fallback HTTP multi-estratégia + Piped com health-check dinâmico
            - **Biblioteca unificada**: abas "Meu aparelho" (MediaStore local) + "Online (YouTube)" com fila mista no Media3
            - **OxyDJ**: recomendações 100% locais usando histórico Room + relacionados do Innertube + similaridade por artista
            - **Redesign deep-tech**: paleta idêntica ao portfólio do NATSKY (preto + teal + âmbar), fontes mono pros detalhes técnicos (bitrate/duração)
            - **APK assinado com keystore próprio** — atualizações futuras não quebram

            ### 📥 Instalação
            1. Baixe o arquivo `OxyMusic-2.0.0.apk` abaixo
            2. Permita instalação de fontes desconhecidas
            3. Toque no APK para instalar
            4. Se você já tinha o OxyMusic 1.x, basta instalar por cima — o app vai atualizar sem perder dados

            ### ⚙️ Permissões novas
            - **Acesso ao áudio** (Android 13+): necessário para listar suas músicas locais na aba "Meu aparelho"

            ### ⚙️ Otimização HyperOS/MIUI
            - Configurações → Apps → OxyMusic → Bateria → "Sem restrições"
            - Segurança → Permissões → Auto-start → ative

            ### 📋 Changelog completo
            Veja [CHANGELOG.md](https://github.com/Kronos1027/oxymusicplay/blob/main/CHANGELOG.md)

            ### 💜 Créditos
            Feito por **NATSKY** — [@Kronos1027](https://github.com/Kronos1027)

            > _"deep tech / terminal de IA" — mesma identidade visual do portfólio_
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
